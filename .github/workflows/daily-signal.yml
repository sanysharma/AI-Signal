name: Daily AI Signal

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily — edit to taste
  workflow_dispatch: {}    # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run editorial engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run digest

      - name: Commit today's digest
        run: |
          git config user.name "ai-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily digest: $(date -u +%F)"
          git push
