<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1EE; --surface:#FFFFFF; --text:#12211B; --muted:#57685F;
    --line:#D5DED8; --accent:#0E7A56; --accent-soft:#DCEEE5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C1210; --surface:#131C18; --text:#E6EEE9; --muted:#8FA398;
      --line:#213029; --accent:#3FDBA0; --accent-soft:#173229;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Public Sans',-apple-system,sans-serif;padding:24px 20px 60px;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:2rem;margin:0;}
  .meta{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:6px;}
  header{border-bottom:2px solid var(--text);padding-bottom:16px;margin-bottom:28px;}
  .story{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-bottom:18px;}
  .cat{font-family:'JetBrains Mono',monospace;font-size:0.66rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:3px;display:inline-block;margin-bottom:10px;}
  .story h2{font-family:'Newsreader',Georgia,serif;font-size:1.15rem;font-weight:600;margin:0 0 10px 0;}
  .story p{font-size:0.94rem;line-height:1.6;margin:0 0 10px 0;}
  .impl{font-size:0.88rem;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;}
  .impl b{font-family:'JetBrains Mono',monospace;font-size:0.66rem;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px;}
  .src{font-size:0.78rem;color:var(--muted);margin-top:10px;}
  .src a{color:var(--accent);}
  .empty{font-size:0.95rem;color:var(--muted);padding:40px 0;text-align:center;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AI Signal</h1>
      <div class="meta" id="date-line">Loading…</div>
    </header>
    <div id="stories"></div>
  </div>

<script>
async function load() {
  const container = document.getElementById('stories');
  const dateLine = document.getElementById('date-line');
  try {
    const index = await fetch('data/index.json').then(r => r.json());
    const latest = index.latest;
    if (!latest) throw new Error('no digest yet');
    dateLine.textContent = latest;
    const day = await fetch(`data/${latest}.json`).then(r => r.json());
    if (!day.stories || day.stories.length === 0) {
      container.innerHTML = '<div class="empty">No stories cleared the bar today.</div>';
      return;
    }
    container.innerHTML = day.stories.map(s => `
      <article class="story">
        <span class="cat">${escapeHtml(s.category)}</span>
        <h2>${escapeHtml(s.title)}</h2>
        <p>${escapeHtml(s.summary)}</p>
        <div class="impl"><b>Design implication</b>${escapeHtml(s.design_implication)}</div>
        <div class="src"><a href="${s.source_url}" target="_blank" rel="noopener">${escapeHtml(s.source_name)}</a> · ${escapeHtml(s.source_date || '')}</div>
      </article>
    `).join('');
  } catch (err) {
    dateLine.textContent = 'No digest published yet';
    container.innerHTML = '<div class="empty">Run the workflow once (Actions tab → Daily AI Signal → Run workflow) to publish the first digest.</div>';
  }
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
load();
</script>
</body>
</html>
